# Glance (Caracal / 2024.1)
# Pin write policies so ai_observer project assignments do not become write
# access through legacy/default policy fallbacks. Grant broad read/list only.
"default": "role:admin"
"context_is_admin": "role:admin"
"add_image": "role:admin or (role:member and project_id:%(project_id)s and project_id:%(owner)s)"
"delete_image": "role:admin or (role:member and project_id:%(project_id)s)"
"modify_image": "role:admin or (role:member and project_id:%(project_id)s)"
"publicize_image": "role:admin"
"communitize_image": "role:admin or (role:member and project_id:%(project_id)s)"
"upload_image": "role:admin or (role:member and project_id:%(project_id)s)"
"delete_image_location": "role:admin"
"set_image_location": "role:admin or (role:member and project_id:%(project_id)s)"
"add_member": "role:admin or (role:member and project_id:%(project_id)s)"
"delete_member": "role:admin or (role:member and project_id:%(project_id)s)"
"modify_member": "role:admin or (role:member and project_id:%(member_id)s)"
"add_task": "role:admin"
"modify_task": "role:admin"
"tasks_api_access": "role:admin"
"metadef_admin": "role:admin"
"manage_image_cache": "role:admin"
"cache_image": "role:admin"
"cache_delete": "role:admin"

# Caracal reader defaults with ai_observer added. These keep admin access and
# normal visibility/project constraints for reader, while ai_observer is the
# approved read-only administrative observer.
"get_images": "rule:context_is_admin or ((role:reader or role:ai_observer) and project_id:%(project_id)s)"
"get_image": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or project_id:%(member_id)s or 'community':%(visibility)s or 'public':%(visibility)s or 'shared':%(visibility)s)) or role:ai_observer"
"get_image_location": "rule:context_is_admin or ((role:reader or role:ai_observer) and project_id:%(project_id)s) or role:ai_observer"
"download_image": "rule:context_is_admin or (role:member and (project_id:%(project_id)s or project_id:%(member_id)s or 'community':%(visibility)s or 'public':%(visibility)s or 'shared':%(visibility)s)) or role:ai_observer"
"get_members": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or project_id:%(member_id)s)) or role:ai_observer"
"get_member": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or project_id:%(member_id)s)) or role:ai_observer"
"get_metadef_namespaces": "rule:context_is_admin or ((role:reader or role:ai_observer) and project_id:%(project_id)s) or role:ai_observer"
"get_metadef_namespace": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_objects": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_object": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_properties": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_property": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"list_metadef_resource_types": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_resource_type": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_tags": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_metadef_tag": "rule:context_is_admin or ((role:reader or role:ai_observer) and (project_id:%(project_id)s or 'public':%(visibility)s)) or role:ai_observer"
"get_tasks": "role:reader or role:ai_observer"
"get_task": "role:reader or role:ai_observer"
