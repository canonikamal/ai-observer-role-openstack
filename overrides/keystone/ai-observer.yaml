# Keystone (Caracal / 2024.1)
# Caracal Keystone does not use the Yoga-era system_reader_api,
# domain_reader_api, or project_reader_api aliases. Extend concrete read-only
# identity policies instead, and leave all create/update/delete policies on
# their upstream admin/owner defaults.
"identity:get_access_rule": "((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.user.id)s"
"identity:list_access_rules": "((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.user.id)s"
"identity:get_application_credential": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or rule:owner"
"identity:list_application_credentials": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or rule:owner"
"identity:get_consumer": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_consumers": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_credential": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.credential.user_id)s"
"identity:list_credentials": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.credential.user_id)s"
"identity:get_domain": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all) or token.domain.id:%(target.domain.id)s or token.project.domain.id:%(target.domain.id)s"
"identity:list_domains": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and domain_id:%(target.domain.id)s)"
"identity:get_domain_config": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_endpoint": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_endpoints": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_endpoint_group": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_endpoint_groups": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_group": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and token.domain.id:%(target.group.domain_id)s)"
"identity:list_groups": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and domain_id:%(target.group.domain_id)s)"
"identity:list_groups_for_user": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.user.id)s"
"identity:list_users_in_group": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and token.domain.id:%(target.group.domain_id)s)"
"identity:get_limit": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_limits": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_registered_limit": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_registered_limits": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_policy": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_policies": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_project": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and project_id:%(target.project.id)s)"
"identity:list_projects": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_user_projects": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.user.id)s"
"identity:get_project_tag": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and project_id:%(target.project.id)s)"
"identity:list_project_tags": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and project_id:%(target.project.id)s)"
"identity:get_protocol": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_protocols": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_region": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_regions": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_role": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_roles": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_implied_roles": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_role_inference_rule": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_role_assignments": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:check_grant": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_grants": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_service": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_services": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_service_provider": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:list_service_providers": "rule:admin_required or ((role:reader or role:ai_observer) and system_scope:all)"
"identity:get_trust": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.trust.trustor_user_id)s or user_id:%(target.trust.trustee_user_id)s"
"identity:list_trusts": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(trust.trustor_user_id)s or user_id:%(trust.trustee_user_id)s"
"identity:list_roles_for_trust": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.trust.trustor_user_id)s or user_id:%(target.trust.trustee_user_id)s"
"identity:get_role_for_trust": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or user_id:%(target.trust.trustor_user_id)s or user_id:%(target.trust.trustee_user_id)s"
"identity:get_user": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and token.domain.id:%(target.user.domain_id)s) or user_id:%(target.user.id)s"
"identity:list_users": "(rule:admin_required) or ((role:reader or role:ai_observer) and system_scope:all) or ((role:reader or role:ai_observer) and domain_id:%(target.domain_id)s)"
