# Neutron (Caracal / 2024.1)
# Pin legacy owner/member aliases so ai_observer project assignments do not
# become write access, then extend reader-style checks to include ai_observer.
"context_is_admin": "role:admin"

# Rule aliases used by multiple policies.
"admin_only": "rule:context_is_admin"
"service_api": "role:service"
"regular_user": "role:member"
"owner": "(role:member or role:admin) and project_id:%(project_id)s"
"admin_or_owner": "rule:context_is_admin or rule:owner"

# Explicit mutation policies. These must never match ai_observer.
"create_network": "rule:admin_only or (role:member and project_id:%(project_id)s)"
"create_network:port_security_enabled": "rule:admin_only or (role:member and project_id:%(project_id)s)"
"create_network:shared": "rule:admin_only"
"create_network:router:external": "rule:admin_only"
"create_network:is_default": "rule:admin_only"
"create_network:segments": "rule:admin_only"
"create_network:provider:network_type": "rule:admin_only"
"create_network:provider:physical_network": "rule:admin_only"
"create_network:provider:segmentation_id": "rule:admin_only"
"update_network": "rule:admin_only or (role:member and project_id:%(project_id)s)"
"update_network:port_security_enabled": "rule:admin_only or (role:member and project_id:%(project_id)s)"
"update_network:shared": "rule:admin_only"
"update_network:router:external": "rule:admin_only"
"update_network:is_default": "rule:admin_only"
"update_network:segments": "rule:admin_only"
"update_network:provider:network_type": "rule:admin_only"
"update_network:provider:physical_network": "rule:admin_only"
"update_network:provider:segmentation_id": "rule:admin_only"
"delete_network": "role:member and project_id:%(project_id)s"
"create_subnet": "role:member and project_id:%(project_id)s"
"update_subnet": "role:member and project_id:%(project_id)s"
"delete_subnet": "role:member and project_id:%(project_id)s"
"create_port": "rule:admin_only or rule:service_api or (role:member and project_id:%(project_id)s)"
"create_port:binding:profile": "rule:service_api or rule:admin_only or (role:member and project_id:%(project_id)s)"
"update_port": "rule:admin_only or rule:service_api or (role:member and project_id:%(project_id)s)"
"delete_port": "rule:admin_only or rule:service_api or (role:member and project_id:%(project_id)s)"
"create_router": "role:member and project_id:%(project_id)s"
"update_router": "role:member and project_id:%(project_id)s"
"delete_router": "role:member and project_id:%(project_id)s"
"create_floatingip": "role:member and project_id:%(project_id)s"
"update_floatingip": "role:member and project_id:%(project_id)s"
"delete_floatingip": "role:member and project_id:%(project_id)s"
"create_security_group": "role:member and project_id:%(project_id)s"
"update_security_group": "role:member and project_id:%(project_id)s"
"delete_security_group": "role:member and project_id:%(project_id)s"
"create_security_group_rule": "role:member and project_id:%(project_id)s"
"delete_security_group_rule": "role:member and project_id:%(project_id)s"

# Common project resource reads. Preserve Caracal service/shared/network-owner
# branches and add ai_observer as read-only administrative visibility.
"get_network": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s) or rule:shared or field:networks:router:external=True or rule:context_is_advsvc"
"get_subnet": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s) or rule:shared"
"get_subnetpool": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s) or rule:shared"
"get_port": "rule:admin_only or rule:service_api or role:ai_observer or (role:reader and rule:network_owner) or (role:reader and project_id:%(project_id)s)"
"get_router": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s)"
"get_floatingip": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s)"
"get_security_group": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s)"
"get_security_group_rule": "rule:admin_only or role:ai_observer or (role:reader and project_id:%(project_id)s)"

# Read-only expansions for sensitive read attributes often reserved for admins.
"get_network:segments": "rule:admin_only or role:ai_observer"
"get_network:provider:network_type": "rule:admin_only or role:ai_observer"
"get_network:provider:physical_network": "rule:admin_only or role:ai_observer"
"get_network:provider:segmentation_id": "rule:admin_only or role:ai_observer"
"get_port:binding:vif_type": "rule:admin_only or rule:service_api or role:ai_observer"
"get_port:binding:vif_details": "rule:admin_only or rule:service_api or role:ai_observer"
"get_port:binding:host_id": "rule:admin_only or rule:service_api or role:ai_observer"
"get_port:binding:profile": "rule:admin_only or rule:service_api or role:ai_observer"
"get_port:resource_request": "rule:admin_only or rule:service_api or role:ai_observer"

# Extra admin-gated read-only operational APIs.
"get_agent": "rule:admin_only or role:ai_observer"
"get_dhcp-networks": "rule:admin_only or role:ai_observer"
"get_l3-routers": "rule:admin_only or role:ai_observer"
"get_availability_zone": "role:reader or role:ai_observer"
"get_default_security_group_rule": "role:reader or role:ai_observer"
"get_flavor": "role:reader or role:ai_observer"
"get_service_profile": "rule:admin_only or role:ai_observer"
