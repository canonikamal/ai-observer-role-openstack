# Neutron (Yoga)
# Pin legacy owner/member aliases so ai_observer project assignments do not
# become write access, then extend reader-style checks to include ai_observer.
"context_is_admin": "role:admin"

# Rule aliases used by multiple policies.
"admin_only": "rule:context_is_admin"
"regular_user": "role:member"
"owner": "(role:member or role:admin) and project_id:%(project_id)s"
"admin_or_owner": "rule:context_is_admin or rule:owner"

# Explicit mutation policies. These must never match ai_observer.
"create_network": "role:member and project_id:%(project_id)s"
"create_network:port_security_enabled": "role:member and project_id:%(project_id)s"
"create_network:shared": "role:admin and project_id:%(project_id)s"
"create_network:router:external": "role:admin and project_id:%(project_id)s"
"create_network:is_default": "role:admin and project_id:%(project_id)s"
"create_network:segments": "role:admin and project_id:%(project_id)s"
"create_network:provider:network_type": "role:admin and project_id:%(project_id)s"
"create_network:provider:physical_network": "role:admin and project_id:%(project_id)s"
"create_network:provider:segmentation_id": "role:admin and project_id:%(project_id)s"
"update_network": "role:member and project_id:%(project_id)s"
"update_network:port_security_enabled": "role:member and project_id:%(project_id)s"
"update_network:shared": "role:admin and project_id:%(project_id)s"
"update_network:router:external": "role:admin and project_id:%(project_id)s"
"update_network:is_default": "role:admin and project_id:%(project_id)s"
"update_network:segments": "role:admin and project_id:%(project_id)s"
"update_network:provider:network_type": "role:admin and project_id:%(project_id)s"
"update_network:provider:physical_network": "role:admin and project_id:%(project_id)s"
"update_network:provider:segmentation_id": "role:admin and project_id:%(project_id)s"
"delete_network": "role:member and project_id:%(project_id)s"
"create_subnet": "role:member and project_id:%(project_id)s"
"update_subnet": "role:member and project_id:%(project_id)s"
"delete_subnet": "role:member and project_id:%(project_id)s"
"create_port": "role:member and project_id:%(project_id)s"
"update_port": "role:member and project_id:%(project_id)s"
"delete_port": "role:member and project_id:%(project_id)s"
"create_router": "role:member and project_id:%(project_id)s"
"update_router": "role:member and project_id:%(project_id)s"
"delete_router": "role:member and project_id:%(project_id)s"
"create_floatingip": "role:member and project_id:%(project_id)s"
"update_floatingip": "role:member and project_id:%(project_id)s"
"delete_floatingip": "role:member and project_id:%(project_id)s"
"create_security_group": "role:member and project_id:%(project_id)s"
"update_security_group": "role:member and project_id:%(project_id)s"
"delete_security_group": "role:member and project_id:%(project_id)s"
"create_security_group_rule": "role:member and project_id:%(project_id)s"
"delete_security_group_rule": "role:member and project_id:%(project_id)s"

# Common project resource reads after owner has been tightened to member/admin.
"get_network": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_subnet": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_subnetpool": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_port": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_router": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_floatingip": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_security_group": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"
"get_security_group_rule": "(role:reader or role:ai_observer or role:member or role:admin) and project_id:%(project_id)s"

# Read-only expansions for sensitive read attributes often reserved for admins.
"get_network:segments": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_network:provider:network_type": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_network:provider:physical_network": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_network:provider:segmentation_id": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_port:binding:vif_type": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_port:binding:vif_details": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_port:binding:host_id": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_port:binding:profile": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
"get_port:resource_request": "(role:admin and project_id:%(project_id)s) or (role:ai_observer and project_id:%(project_id)s)"
