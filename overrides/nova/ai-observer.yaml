# Nova (Caracal / 2024.1)
# Pin write/admin personas so legacy owner fallbacks do not treat ai_observer
# project assignments as write access.
"context_is_admin": "role:admin"
"admin_api": "rule:context_is_admin"
"admin_or_owner": "rule:context_is_admin or ((role:member or role:admin) and project_id:%(project_id)s)"
"project_admin_api": "role:admin and project_id:%(project_id)s"
"project_member_api": "(role:member or role:admin) and project_id:%(project_id)s"

# Extend reader persona to include the custom ai_observer role.
"project_reader_api": "(role:reader or role:ai_observer) and project_id:%(project_id)s"
"project_reader_or_admin": "rule:project_reader_api or rule:context_is_admin"
"system_reader_api": "((role:reader or role:ai_observer) and system_scope:all) or rule:context_is_admin"

# Preserve the pre-existing nova-cloud-controller policy override found in the
# target environment.
"os_compute_api:os-extended-server-attributes": "rule:admin_or_owner"

# Project-scoped server reads: keep member/admin owners and add ai_observer
# through the read-only project reader persona.
"os_compute_api:servers": "rule:system_reader_api or rule:project_reader_or_admin or rule:project_member_api"
"os_compute_api:servers:index": "rule:system_reader_api or rule:project_reader_or_admin or rule:project_member_api"
"os_compute_api:servers:detail": "rule:system_reader_api or rule:project_reader_or_admin or rule:project_member_api"
"os_compute_api:servers:show": "rule:system_reader_api or rule:project_reader_or_admin or rule:project_member_api"
"os_compute_api:os-console-output": "role:reader or rule:project_reader_or_admin or rule:project_member_api"

# Explicit compute mutation policies. These must never match ai_observer.
"os_compute_api:servers:create": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:create:attach_volume": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:create:attach_network": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:create:trusted_certs": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:create:zero_disk_flavor": "rule:project_admin_api or rule:admin_or_owner"
"os_compute_api:servers:create:forced_host": "rule:project_admin_api or rule:admin_or_owner"
"compute:servers:create:requested_destination": "rule:project_admin_api or rule:admin_or_owner"
"network:attach_external_network": "rule:project_admin_api or rule:admin_or_owner"
"os_compute_api:servers:delete": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:update": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:confirm_resize": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:revert_resize": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:reboot": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:resize": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:rebuild": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:rebuild:trusted_certs": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:create_image": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:create_image:allow_volume_backed": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:start": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:stop": "rule:project_member_api or rule:admin_or_owner"
"os_compute_api:servers:trigger_crash_dump": "rule:project_member_api or rule:admin_or_owner"

# Optional extra read access for investigation on system-scoped resources.
"os_compute_api:os-services": "rule:system_reader_api"
"os_compute_api:servers:index:get_all_tenants": "rule:system_reader_api"
"os_compute_api:servers:detail:get_all_tenants": "rule:system_reader_api"
"os_compute_api:os-services:list": "rule:system_reader_api"
"os_compute_api:os-hypervisors": "rule:system_reader_api"
"os_compute_api:os-hypervisors:list": "rule:system_reader_api"
"os_compute_api:os-hypervisors:list-detail": "rule:system_reader_api"
"os_compute_api:os-hypervisors:statistics": "rule:system_reader_api"
"os_compute_api:os-hypervisors:show": "rule:system_reader_api"
"os_compute_api:os-hypervisors:uptime": "rule:system_reader_api"
"os_compute_api:os-hypervisors:search": "rule:system_reader_api"
"os_compute_api:os-hypervisors:servers": "rule:system_reader_api"
"os_compute_api:os-aggregates:index": "rule:system_reader_api"
"os_compute_api:os-aggregates:show": "rule:system_reader_api"
"os_compute_api:os-instance-usage-audit-log:list": "rule:system_reader_api"
"os_compute_api:os-instance-usage-audit-log:show": "rule:system_reader_api"
